<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Password Changed</title>
</head>

<body style="margin:0;padding:40px;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">

    <tr>
        <td align="center">

            <table width="600"
                   cellpadding="0"
                   cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);">

                <tr>
                    <td align="center"
                        style="background:#2563eb;color:white;padding:30px;">

                        <h1 style="margin:0;">☁ CloudVault</h1>

                    </td>
                </tr>

                <tr>
                    <td style="padding:40px;">

                        <h2>Password Changed Successfully</h2>

                        <p>
                            Hi <strong th:text="${name}"></strong>,
                        </p>

                        <p>
                            Your CloudVault password was changed successfully.
                        </p>

                        <p>
                            <strong>Time:</strong>
                            <span th:text="${time}"></span>
                        </p>

                        <p>
                            If you made this change, no further action is required.
                        </p>

                        <p>
                            <strong>
                                If you did NOT change your password, please secure your account immediately.
                            </strong>
                        </p>

                    </td>
                </tr>

                <tr>
                    <td
                            style="background:#f8fafc;color:#64748b;text-align:center;padding:20px;font-size:13px;">

                        © 2026 CloudVault

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>

</html>
